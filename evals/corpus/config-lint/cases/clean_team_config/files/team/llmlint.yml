version: 1
rules:
  - name: errors_carry_context
    files: { include: ["src/**/*.rs"] }
    require_line_attribution: true
    description: |
      Every error propagated from a filesystem or network call is wrapped
      with context naming the failed operation. False when such an error
      is propagated bare with `?`.

  - name: migrations_are_reversible
    files: { include: ["migrations/**/*.sql"] }
    relevance: the change adds or edits a schema migration
    description: |
      Every schema migration has a matching down migration that restores
      the previous schema. False when a migration has no down step.
