version: 1
rules:
  - name: errors_carry_context
    files: { include: ["src/**/*.rs"] }
    require_line_attribution: true
    description: |
      Every error propagated from a filesystem or network call is wrapped
      with context naming the failed operation. False when such an error is
      propagated with a bare `?`.

  - name: sql_uses_bound_parameters
    files: { include: ["src/**/*.py"] }
    require_line_attribution: true
    description: |
      Every SQL query passes user-supplied values as bound parameters, never
      interpolated into the query string with f-strings, `%`, or `.format()`.

  - name: http_calls_set_timeouts
    files: { include: ["src/**/*.py"] }
    require_line_attribution: true
    description: |
      Every outbound HTTP request passes an explicit `timeout` argument.

  - name: feature_flags_have_owners
    files: { include: ["config/flags/*.yml"] }
    require_line_attribution: true
    description: |
      Every feature flag entry declares an `owner` key naming a team.

  - name: base_images_are_pinned
    files: { include: ["**/Dockerfile"] }
    require_line_attribution: true
    description: |
      Every `FROM` instruction pins its base image to a version tag or digest,
      never `latest` or an untagged name.

  - name: foo
    files: { include: ["web/src/**/*.ts"] }
    require_line_attribution: true
    description: |
      Every exported TypeScript function declares an explicit return type.
