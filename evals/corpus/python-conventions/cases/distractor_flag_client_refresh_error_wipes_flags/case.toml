description = "In a ~150-line flag client whose docstrings promise an outage keeps the last good flags, refresh()'s `except Exception` silently clears every flag (turning all features off)."

[[expect]]
rule = "exceptions_are_handled_or_reported"
holds = false
file = "src/flags/client.py"
lines = [112, 113, 114, 115]

[[expect]]
rule = "docstrings_match_behavior"
holds = false
file = "src/flags/client.py"
lines = [5, 6, 95, 112, 113, 114]

[[expect]]
rule = "log_messages_are_actionable"
holds = true
