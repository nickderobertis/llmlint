name: CI

on:
  push:
    branches: [main]
  pull_request:
    # llmlint: ignore[no_second_broader_sweep_over_an_already_gated_commit] Draft-era runs skip these jobs and cannot supply the merge path's required verdict after the draft is lifted; ready_for_review is the only run that supplies that verdict for an unchanged head.
    types: [opened, synchronize, reopened, ready_for_review]
  # A manual full sweep of the dispatched commit: the recovery when a release
  # finds no sweep verdict for its tree (.github/scripts/ci-gate.sh verdict).
  workflow_dispatch:
    inputs:
      macos_diagnostic:
        description: Run the single Mac diagnostic lane
        type: boolean
        default: false

# Least privilege: most jobs only need to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate, at the tier this run owes (.github/scripts/ci-gate.sh tier; AGENTS.md
  # "Commits, releases, and merging" records the placement): the AFFECTED tier on
  # a pull request (from its merge base with the base branch) and on a push to
  # main (from the previous tip), the FULL SWEEP on the release-plz release PR —
  # checked out at its head, the tree the release's verdict compares — and on a
  # manual dispatch. Both are the same `just check` recipe, the sweep with
  # `--all`. Linux-only because coverage is measured here (the `#[cfg(unix)]`
  # subprocess tests run on Linux); macOS/Windows prove the artifact via `cross`.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the affected tier keys off an explicit merge base, and
          # the version-bump check below diffs the PR against its base.
          fetch-depth: 0
      - name: Choose the gate tier
        id: tier
        run: bash .github/scripts/ci-gate.sh tier
      - name: Check out the release PR's head
        if: steps.tier.outputs.head != ''
        env:
          HEAD_SHA: ${{ steps.tier.outputs.head }}
        run: git checkout --detach "$HEAD_SHA"
      # Installs the pinned channel + components from rust-toolchain.toml, so CI
      # gates on the toolchain contributors build with. `cache: false` keeps the
      # one rust-cache step below; the action's default `RUSTFLAGS=-D warnings`
      # stays, so a compiler warning in the test/coverage build fails too.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest,cargo-llvm-cov
      # The bun .tool-versions pins; it installs and runs Nx from bun.lock.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      # The ruby .tool-versions pins (setup-ruby reads it when given no version);
      # it runs bashcov, the shell coverage tool, which bootstrap installs from
      # Gemfile.lock.
      - uses: ruby/setup-ruby@v1
      # Bootstrap also installs the justfile-pinned shfmt and shellcheck (digest-
      # checked prebuilt releases) that every shell project's format and lint run.
      - name: Bootstrap
        run: just bootstrap
      - name: Install actionlint
        run: just actionlint-tools
      # The Nx cache is local to this runner and starts cold, so every target
      # here runs from a clean build: a cached result never stands in for CI.
      - name: Gate (fmt + shfmt, clippy + shellcheck + boundaries, workflow lint, build, tests + Rust and shell coverage, docs)
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          BASE: ${{ steps.tier.outputs.base }}
        run: |
          if [ "$TIER" = all ]; then
            just check --all
          else
            NX_BASE="$BASE" just check
          fi
      # Dogfood `check-version-bump` on llmlint's own versioned plugin
      # (`assets/config_lint.yml`, which no standard config glob matches, so the
      # recipe names it explicitly): fail the PR if it changed vs the base without a
      # `version:` bump. Uses the PR base commit as the diff base (reachable in the
      # full history fetched above); only meaningful on a PR.
      - name: Versioned configs bumped vs the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: just check-version-bump "$BASE_SHA"

  # Prove the artifact builds and its tests pass on macOS and Windows, at the same
  # tier as `gate` (without the coverage floors, which are enforced on Linux, and
  # without shfmt/shellcheck/actionlint, which are platform-independent and run
  # there). The two switches are check-portable's; set for the job, they also make
  # bootstrap skip installing the Linux-only shell tools and bashcov.
  policy:
    runs-on: ubuntu-latest
    outputs:
      macosRequired: ${{ steps.classify.outputs.macosRequired }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DIAGNOSTIC: ${{ inputs.macos_diagnostic }}
        run: |
          decision=$(node .github/macos-policy.mjs classify --event "$GITHUB_EVENT_PATH" --base "${BASE:-HEAD}" --head "${HEAD:-HEAD}")
          required=$(jq -r .macosRequired <<<"$decision")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$DIAGNOSTIC" = true ]; then
            required=true
          fi
          echo "macosRequired=$required" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r .reason <<<"$decision")" >> "$GITHUB_OUTPUT"

  # The single PR Mac lane proves cross, end-user install, and authenticated live usage sequentially.
  macos:
    needs: policy
    if: needs.policy.outputs.macosRequired == 'true'
    runs-on: macos-latest
    env:
      LLMLINT_COVERAGE: "off"
      LLMLINT_SHELL_TOOLS: "off"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose the gate tier
        id: tier
        run: bash .github/scripts/ci-gate.sh tier
      - name: Check out the release PR's head
        if: steps.tier.outputs.head != ''
        env:
          HEAD_SHA: ${{ steps.tier.outputs.head }}
        run: git checkout --detach "$HEAD_SHA"
      # The pinned toolchain from rust-toolchain.toml, as in `gate` (same inputs).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Bootstrap
        run: just bootstrap
      - name: Portable gate (format, clippy + boundaries, tests uninstrumented)
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          BASE: ${{ steps.tier.outputs.base }}
        run: |
          if [ "$TIER" = all ]; then
            just check-portable --all
          else
            NX_BASE="$BASE" just check-portable
          fi

      - uses: dtolnay/rust-toolchain@stable
      - name: Install (recommended end-user method)
        run: cargo install --path . --locked
      - name: Smoke-test the installed binary
        run: |
          llmlint --version
          llmlint --help >/dev/null
          tmp="$(mktemp -d)"
          cd "$tmp"
          llmlint init
          llmlint config
      - uses: actions/setup-node@v4
        if: github.repository == 'nickderobertis/llmlint' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          node-version: lts/*
      - name: Install live harnesses
        if: github.repository == 'nickderobertis/llmlint' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          cargo install --git https://github.com/nickderobertis/oneharness --locked oneharness
          oneharness --version
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Live e2e against the real claude-code harness
        # llmlint: ignore[live_tier_compiles_and_requires_credential] Preserve the original live workflow's fork omission because forks receive no auth secrets; protected cross/install contexts still require their real Mac assertions, and do not claim a live proof ran. Authenticated live runs remain hard failures on missing credentials.
        if: github.repository == 'nickderobertis/llmlint' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_E2E_MODEL: ${{ vars.CLAUDE_E2E_MODEL }}
        # llmlint: ignore[external_service_suite_stays_out_of_the_affected_tier] The approved scheduling contract requires the Mac cross, install and live proofs in one PR job; Linux and Windows live proofs retain their independent workflow. A failed Mac proof must fail both protected carriers.
        run: just live-claude

  # Linux carriers keep protected contexts present, including an authorized release-only omission.
  cross-macos:
    name: cross (macos-latest)
    needs: [policy, gate, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/macos-result.mjs

  install-macos:
    name: install (macos-latest)
    needs: [policy, gate, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/macos-result.mjs

  cross:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      LLMLINT_COVERAGE: "off"
      LLMLINT_SHELL_TOOLS: "off"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose the gate tier
        id: tier
        run: bash .github/scripts/ci-gate.sh tier
      - name: Check out the release PR's head
        if: steps.tier.outputs.head != ''
        env:
          HEAD_SHA: ${{ steps.tier.outputs.head }}
        run: git checkout --detach "$HEAD_SHA"
      # The pinned toolchain from rust-toolchain.toml, as in `gate` (same inputs).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Bootstrap
        run: just bootstrap
      - name: Portable gate (format, clippy + boundaries, tests uninstrumented)
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          BASE: ${{ steps.tier.outputs.base }}
        run: |
          if [ "$TIER" = all ]; then
            just check-portable --all
          else
            NX_BASE="$BASE" just check-portable
          fi

  # Advisory + license audit and unused-dependency check (own job: needs a
  # network advisory DB).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny check
      - run: cargo machete

  # Prove the end-user install path on every platform: install the shipped
  # binary the documented way and smoke-test the real artifact. No oneharness or
  # network needed for `--version`/`init`/`config`.
  install:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Deliberately a stock rustup + stable rather than the pinned dev toolchain
      # the gate jobs install: this job stands in for an end user's machine, and
      # the documented install is `cargo install` on whatever rustup they have.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install (recommended end-user method)
        run: cargo install --path . --locked
      - name: Smoke-test the installed binary
        run: |
          llmlint --version
          llmlint --help >/dev/null
          tmp="$(mktemp -d)"
          cd "$tmp"
          llmlint init
          llmlint config

  # Lint the PR title: under squash-merge it becomes the release-driving commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  llmlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Install llmlint toolchain
        run: ./scripts/setup-llmlint.sh
      # llmlint judges THROUGH oneharness, whose committed `oneharness.toml`
      # selects codex first (claude-code is the fallback). setup-llmlint.sh
      # installs llmlint + oneharness only, not a harness, so without this every
      # run falls through the whole chain and errors ("codex not found on PATH").
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex --version
      # Codex ignores OPENAI_API_KEY for headless runs; its documented CI pattern
      # is `codex login --with-api-key` (writes ~/.codex/auth.json). The judge
      # cannot run without the key, so a missing secret (including a fork PR,
      # which receives no secrets) fails here, before any lint runs.
      - name: Authenticate Codex with the API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::llmlint needs the OPENAI_API_KEY secret for the Codex harness; set it under Settings > Secrets and variables > Actions" >&2
            exit 1
          fi
          printenv OPENAI_API_KEY | codex login --with-api-key
      - name: Validate llmlint config
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint changed files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: just lint-llm-diff origin/main
