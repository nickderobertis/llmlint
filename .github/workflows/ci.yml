name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: most jobs only need to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full gate, including e2e and the coverage threshold. Linux-only because
  # coverage is measured here (the `#[cfg(unix)]` subprocess tests run on Linux);
  # macOS/Windows prove the artifact via the `cross` job below.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the version-bump check below can diff the PR against
          # its base (a shallow clone can't resolve the merge-base).
          fetch-depth: 0
      # Installs the pinned channel + components from rust-toolchain.toml, so CI
      # gates on the toolchain contributors build with. `cache: false` keeps the
      # one rust-cache step below; the action's default `RUSTFLAGS=-D warnings`
      # stays, so a compiler warning in the test/coverage build fails too.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest,cargo-llvm-cov
      - name: Bootstrap
        run: just bootstrap
      - name: Install actionlint
        run: just actionlint-tools
      - name: Full gate (fmt, workflow lint, clippy, tests + coverage, docs)
        run: just check
      # Dogfood `check-version-bump` on llmlint's own versioned plugin
      # (`assets/config_lint.yml`, which no standard config glob matches, so the
      # recipe names it explicitly): fail the PR if it changed vs the base without a
      # `version:` bump. Uses the PR base commit as the diff base (reachable in the
      # full history fetched above); only meaningful on a PR. Reuses the artifacts
      # `just check` already built, so it adds no compile.
      - name: Versioned configs bumped vs the PR base
        if: github.event_name == 'pull_request'
        run: just check-version-bump ${{ github.event.pull_request.base.sha }}

  # Prove the artifact builds and its tests pass on macOS and Windows (without
  # the coverage threshold, which is enforced on Linux).
  cross:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain from rust-toolchain.toml, as in `gate` (same inputs).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      - name: Bootstrap
        run: just bootstrap
      - name: Format + lint
        run: just fmt-check && just lint
      - name: Tests (unit + integration + e2e)
        run: cargo nextest run --features mock-oneharness --locked

  # Advisory + license audit and unused-dependency check (own job: needs a
  # network advisory DB).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny check
      - run: cargo machete

  # Prove the end-user install path on every platform: install the shipped
  # binary the documented way and smoke-test the real artifact. No oneharness or
  # network needed for `--version`/`init`/`config`.
  install:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Deliberately a stock rustup + stable rather than the pinned dev toolchain
      # the gate jobs install: this job stands in for an end user's machine, and
      # the documented install is `cargo install` on whatever rustup they have.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install (recommended end-user method)
        run: cargo install --path . --locked
      - name: Smoke-test the installed binary
        run: |
          llmlint --version
          llmlint --help >/dev/null
          tmp="$(mktemp -d)"
          cd "$tmp"
          llmlint init
          llmlint config

  # Lint the PR title: under squash-merge it becomes the release-driving commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  llmlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Install llmlint toolchain
        run: ./scripts/setup-llmlint.sh
      # llmlint judges THROUGH oneharness, whose committed `oneharness.toml`
      # selects codex first (claude-code is the fallback). setup-llmlint.sh
      # installs llmlint + oneharness only, not a harness, so without this every
      # run falls through the whole chain and errors ("codex not found on PATH").
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex --version
      # Codex ignores OPENAI_API_KEY for headless runs; its documented CI pattern
      # is `codex login --with-api-key` (writes ~/.codex/auth.json). Skipped when
      # the secret is withheld (a fork PR) — the lint step below still fails
      # loudly on the missing key rather than passing.
      - name: Authenticate Codex with the API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printenv OPENAI_API_KEY | codex login --with-api-key
          fi
      - name: Validate llmlint config
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint changed files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::llmlint needs OPENAI_API_KEY for the Codex harness" >&2
            exit 1
          fi
          just lint-llm-diff origin/main
