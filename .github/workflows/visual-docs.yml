# Terminal screenshots via screencomp's reusable workflow. The capture step is
# ours (scripts/screenshots.sh); screencomp owns the classify gate, the HTML
# gallery, the GitHub Pages deploy, and the sticky before/after PR comment.
#
# Which CPU arch(es) CI captures is read from [capture].arches in screencomp.toml
# — one lane per arch, fanned out by the reusable workflow (arm64 runs on
# ubuntu-24.04-arm). llmlint declares x86_64 and arm64 because its pre-push guard
# is local and classifies the host's own lane; the shots are deterministic SVGs
# (vendored, pinned font) so the two lanes' baselines are identical bytes, and
# each lane here is the check on the other. No pinned capture container is needed.
name: Visual docs

on:
  pull_request:
    # `closed` lets screencomp delete this PR's gh-pages preview once it closes,
    # so stale /pr-<n>/ galleries do not accumulate on the branch.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  schedule:
    # Monthly: prune the gh-pages gallery history so committed images do not grow
    # the branch without bound (keeps the 20 most recent versions; see below).
    - cron: "27 4 1 * *"

permissions:
  contents: write       # push the gh-pages gallery
  pull-requests: write  # post the diff comment

jobs:
  visual-docs:
    uses: nickderobertis/screencomp/.github/workflows/visual-docs-reusable.yml@v0.4.2
    with:
      # Strict gate (the safe default): CI FAILS if the capture drifts from the
      # committed baseline (shots/baseline/<arch>.json). Regenerate it locally
      # with `just screenshots` (the pre-push guard does this for you) and commit.
      fail-on-drift: true
      # Keep the gh-pages gallery bounded: delete this PR's preview on close and
      # prune history on the monthly schedule above.
      gh-pages-maintenance: true
      gh-pages-history-versions: 20
      # The capture-command runs INSIDE this container (the reusable workflow's
      # default is a Playwright image for web apps). Ours needs Rust to build the
      # binaries, so pin the matching Rust image (it carries curl/git/tar via
      # buildpack-deps). The shots are deterministic SVGs (vendored font), so the
      # image only has to build + render — no Playwright, no pinned-CPU concerns.
      container: rust:1.96.0-bookworm
      # Install the pinned `freeze` from its prebuilt release (no Go needed), then
      # capture. The asset must match THIS runner's architecture — the arm64 lane
      # runs on ubuntu-24.04-arm — so the choice lives in a script
      # (scripts/ci-install-freeze.sh) that picks it from `uname -m`, rather than in
      # a hard-coded URL here. RUSTUP_TOOLCHAIN bypasses rust-toolchain.toml so we
      # build with the image's toolchain instead of syncing its extra
      # components/targets (the SVG bytes don't depend on the compiler anyway). The
      # reusable workflow exports $SHOTS_OUT as shots/current/<arch>; the script
      # writes captures.json + SVGs.
      capture-command: |
        export RUSTUP_TOOLCHAIN=1.96.0
        bash scripts/ci-install-freeze.sh
        bash scripts/screenshots.sh
